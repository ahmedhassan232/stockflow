# Development stack.   docker compose up --build   →   http://localhost:8080
name: stockflow

x-backend: &backend
  build:
    context: ./backend
    dockerfile: ../infrastructure/docker/Dockerfile.backend
    target: dev
  env_file: .env
  volumes:
    - ./backend:/app
    - storage:/var/lib/stockflow/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/10-init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_DEV_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    ports: ["8080:80"]
    depends_on: [backend, frontend]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]   # web UI; SMTP on mailpit:1025 inside the network

volumes:
  pgdata:
  redisdata:
  storage:
  frontend_node_modules:
