[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stockflow-backend"
version = "0.1.0"
description = "StockFlow – multi-tenant inventory, warehouse & sales management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "email-validator==2.3.0",
    "pydantic-settings==2.16.3",
    "SQLAlchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary,pool]==3.3.9",
    "redis==8.1.0",
    "celery==5.7.0",
    "PyJWT==2.15.1",
    "argon2-cffi==25.1.0",
    "weasyprint==63.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608", "E501"]
"migrations/*" = ["S608", "E501"]
"app/core/pdf.py" = ["E501"]
"app/modules/reports/pdf.py" = ["E501"]
"app/scripts/*" = ["E501", "T201", "RUF001"]
