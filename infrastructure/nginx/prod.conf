# Production gateway. TLS is expected to terminate here (mount certificates and
# enable the 443 server below) or at an upstream load balancer.
# See docs/deployment.md.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API docs are not published in production.
    location ~ ^/api/v1/(docs|redoc|openapi\.json) { return 404; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_read_timeout 60s;
        proxy_pass http://backend:8000;
    }

    location / {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://frontend:8080;
    }
}

